<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#07090f" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6384ff" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="url(#primaryGrad)" stroke-width="8" stroke-opacity="0.4" />

  <!-- Shield / Emblem Shape -->
  <path d="M256 72 L392 124 V248 C392 344 330 416 256 448 C182 416 120 344 120 248 V124 Z" 
        fill="none" 
        stroke="url(#primaryGrad)" 
        stroke-width="20" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Stylized "C" Symbol in Center -->
  <path d="M304 192 C286 174 258 170 236 184 C210 200 200 232 200 256 C200 280 210 312 236 328 C258 342 286 338 304 320" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="32" 
        stroke-linecap="round" />

  <!-- Certification Sparkle Dot -->
  <circle cx="320" cy="192" r="16" fill="#34d399" />
</svg>
